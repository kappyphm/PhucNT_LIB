name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate library
        run: python scripts/build_pcm.py --check-only

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build archive without updating indexes
        run: python scripts/build_pcm.py --no-index --timestamp 2000-01-01T00:00:00Z
